name: Build Flutter App (CorNigrum Reader - Kokoro ONNX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 cmake;3.22.1'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Initialize Project Directories
        run: |
          chmod +x scripts/download_assets.sh
          ./scripts/download_assets.sh

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: cornigrum-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
