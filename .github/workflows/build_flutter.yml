name: Build Flutter App (CorNigrum Reader - Kokoro ONNX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 cmake;3.22.1'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      
      - name: Check Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Initialize Project Directories
        run: |
          chmod +x scripts/download_assets.sh
          ./scripts/download_assets.sh

      - name: Install Dependencies
        run: |
          flutter pub get

      # ─── Auto-Fix Warnings & Format ─────────────────────
      - name: Apply Automatic Fixes & Format
        run: |
          dart fix --apply
          dart format .

      # ─── Generate Launcher Icons ────────────────────────
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # ─── Code Generation ────────────────────────────────
      - name: Run build_runner
        run: |
          dart run build_runner build --delete-conflicting-outputs

      # ─── Analyze ────────────────────────────────────────
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # ─── Build Release APK ──────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FLUTTER_BUILD_NAME=1.0.0 \
            --dart-define=FLUTTER_BUILD_NUMBER=1

      # ─── Upload Directly as APK (GitHub Release) ────────
      - name: Create Nightly Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          name: "CorNigrum Reader (Latest Build)"
          body: "أحدث نسخة تجريبية جاهزة للتثبيت المباشر من CorNigrum Reader."
          draft: false
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


